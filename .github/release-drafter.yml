categories:
  - title: '🚀 Features'
    labels: 
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels: 
      - 'dependencies'
      - 'maintenance'
      - 'docs'
      - 'tech debt'
      - 'security fix'
      - 'security vulnerability'
# Resolves to the next patch after the latest release; make it match version.py before publishing.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## What’s Changed
  $CHANGES
  
