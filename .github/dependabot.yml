version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    open-pull-requests-limit: 5
    reviewers: [neiljhowell]
    groups:
      pip-all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: US/Central
    reviewers: [neiljhowell]
    groups:
      actions-all:
        patterns: ["*"]